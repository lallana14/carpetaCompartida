<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Bordes de imagen</title>
    <link rel="stylesheet" href="estilos.css">
</head>
<body>
    <h1>Galería de cuadros de perros</h1>
    <div class="galeria"><!-- contenedor flexible -->
        <section><!-- sección de contenido -->
            <h2 align="center">Perro 1</h2>
            <img src="perro1.jpg" class="bordeMadera"><!-- imagen con borde de madera -->
        </section>
        <aside><!-- barra lateral -->
            <h2 align="center">Perro 2</h2>
            <img src="perro2.jpg" class="bordeMetal"><!-- imagen con borde de metal -->
        </aside>
    </div>
</body>
</html>
