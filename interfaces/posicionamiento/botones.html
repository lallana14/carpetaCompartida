<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>botones</title>
    <link rel="stylesheet" href="botones.css">
</head>
<body>
    <div>Menu</div>
    <!-- boton de inicio -->
    <div> <button class="principal_on">INICIO</button> </div>
    <br>
    <!-- boton de contacto -->
    <div><button class="principal_on">CONTACTO</button></div>
    <br>

    <!--hacemos un menu con ul y li
    asi hacemos que se le apliquen igual la clase-->
    <ul>
        <li class="principal_on">INICIO</li>
        <li class="principal_on">CONTACTO</li>
        <li class="principal_on">REGISTRO</li>
        <li class="principal_on">ADMIN</li>
    </ul>
    <br>

    <!--como poner botones con imagenes y enlaces
    el encale "envuelve" al button-->
    <div><a href="https://www.chatgpt.com"><button class="menu"></button></a></div>
    <br>
    <div><a href="https://www.google.com"><button class="learn"></button></a></div>
    <br>
</body>
</html>
