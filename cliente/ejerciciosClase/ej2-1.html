    <script>

        function ordenaCreciente(array){//funcion que ordena de menor a mayor
            let lrg = array.length;
            let nuevoArray = [];
            let menor;
            
            for(let i = 0; i<lrg; i++){//tratar el array
                let valores = array.toString();//convertir a cadena para poder usar el metodo Math.min
                valores = valores.split(",");//convertir a array para poder usar el metodo Math.min
                for(let j=0; j<valores.length; j++){
                    valores[j] = parseInt(valores[j]);//convertir a entero
                }
                menor = valores[0];//cojo el menor de lo valores
                cuentaMenores = 1;
                for(let k=1; k<valores.length; k++){//voy buscando el menor
                    if(valores[k]<menor){
                        menor = valores[k];
                        cuentaMenores = 1;
                    }else if( valores[k] == menor){
                        cuentaMenores += 1;
                    }
                }
                // console.log("menor: " + menor);
                nuevoArray[i] = menor;//lo copio en el nuevo array
                array.splice(array.indexOf(menor), 1);//quito el menor
                // console.log(array);
            }
            array = nuevoArray;//copiar al array original el nuevo
            console.log(array);//mostrar
            return array;//devuelve el array ordenado
        }

        function ordenaDecreciente(array){//funcion que ordena de mayor a menor
            let lrg = array.length;
            let nuevoArray = [];
            let mayor;
            
            for(let i = 0; i<lrg; i++){//tratar el array
                let valores = array.toString();//convertir a cadena para poder usar el metodo Math.min
                valores = valores.split(",");//convertir a array para poder usar el metodo Math.min
                for(let j=0; j<valores.length; j++){
                    valores[j] = parseInt(valores[j]);//convertir a entero
                }
                mayor = valores[0];//cojo el mayor de lo valores
                for(let k=1; k<valores.length; k++){//voy buscando el mayor
                    if(valores[k]>mayor){
                        mayor = valores[k];
                    }
                }
                // console.log("mayor: " + mayor);
                nuevoArray[i] = mayor;//lo copio en el nuevo array
                array.splice(array.indexOf(mayor), 1);//quito el mayor
                // console.log(array);
            }
            array = nuevoArray;//copiar al array original el nuevo
            console.log(array);//mostrar
            return array;//devuelve el array ordenado
        }

        function ordena(array, orden){//funcion que ordena el array segun el parametro orden
            orden = orden.toLowerCase();//convierte el orden a minusculas
            if(orden == "creciente"){//compara si es creciente o decreciente
                return ordenaCreciente(array);//caso de creciente
            }else if(orden == "decreciente"){
                return ordenaDecreciente(array);//caso de decreciente
            }else{
                console.log("Error: el parametro 'orden' debe ser 'creciente' o 'decreciente'");//caso de error
            }
        }

        let cad = [1,43,63,1,34,67,2,4];
        cad = ordena(cad, "creciente");
        // ordena(cad, "decreciente");
    </script>
