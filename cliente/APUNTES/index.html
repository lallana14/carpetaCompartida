<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Apuntes de JavaScript</title>

<style>
  :root {
    --fondo: #f6f7f9; --panel: #ffffff; --borde: #e3e6eb; --texto: #1d2330; --suave: #667085;
    --acento: #c99a00; --acento-fondo: #fff6d6; --codigo: #0d1117; --marca: #ffe066;
  }
  body.oscuro {
    --fondo: #0f1218; --panel: #171b23; --borde: #2a303b; --texto: #e6e9ef; --suave: #8b94a5;
    --acento: #f7d046; --acento-fondo: #2b2510;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; }
  body { min-height: 100vh; align-items: start; }
  body { font: 14px/1.5 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; background: var(--fondo); color: var(--texto);
         display: grid; grid-template-columns: 300px 1fr; }
  button { font: inherit; cursor: pointer; }

  /* ---- Barra lateral ---- */
  aside { background: var(--panel); border-right: 1px solid var(--borde); display: flex; flex-direction: column; height: 100vh; position: sticky; top: 0; }
  .cabecera { padding: 16px 16px 10px; border-bottom: 1px solid var(--borde); }
  .cabecera h1 { font-size: 17px; margin: 0 0 10px; display: flex; align-items: center; gap: 8px; }
  .logo { background: #f7df1e; color: #000; font-weight: 800; font-size: 12px; padding: 3px 5px; border-radius: 4px; }
  .buscador { position: relative; }
  .buscador input { width: 100%; padding: 8px 10px 8px 30px; border: 1px solid var(--borde); border-radius: 8px; background: var(--fondo); color: var(--texto); font: inherit; }
  .buscador input:focus { outline: 2px solid var(--acento); border-color: transparent; }
  .buscador::before { content: "⌕"; position: absolute; left: 10px; top: 6px; color: var(--suave); font-size: 16px; }
  .origen { font-size: 12px; margin-top: 8px; padding: 3px 8px; border-radius: 6px; background: var(--fondo); color: var(--suave); }
  .origen.directo { background: #e6f6ea; color: #1a7f37; }
  .origen.aviso { background: #fff8e1; color: #7a5b00; }
  body.oscuro .origen.directo { background: #12291a; color: #56d364; }
  body.oscuro .origen.aviso { background: #2b2510; color: #f7d046; }
  .volver { display: inline-block; font-size: 12px; color: var(--suave); text-decoration: none; margin-bottom: 6px; }
  .volver:hover { color: var(--texto); }
  .tipo { font-size: 10px; font-family: ui-monospace, Consolas, monospace; color: var(--suave); border: 1px solid var(--borde); border-radius: 4px; padding: 0 4px; }
  .btn:disabled { opacity: .55; cursor: not-allowed; }
  .ayuda { font-size: 12px; color: var(--suave); margin-top: 6px; }
  nav { overflow-y: auto; flex: 1; padding: 6px 8px 20px; }
  details { margin-top: 6px; }
  summary { list-style: none; cursor: pointer; padding: 6px 8px; font-weight: 650; font-size: 13px; text-transform: uppercase; letter-spacing: .03em; color: var(--suave); border-radius: 6px; display: flex; justify-content: space-between; }
  summary:hover { background: var(--fondo); }
  summary::after { content: "▸"; transition: transform .15s; }
  details[open] > summary::after { transform: rotate(90deg); }
  .seccion { font-size: 12px; color: var(--suave); padding: 8px 10px 2px 14px; font-style: italic; }
  .leccion { display: flex; gap: 8px; width: 100%; text-align: left; border: 0; background: none; color: var(--texto); padding: 6px 10px; border-radius: 6px; align-items: baseline; }
  .leccion:hover { background: var(--fondo); }
  .leccion.activa { background: var(--acento-fondo); box-shadow: inset 3px 0 0 var(--acento); font-weight: 600; }
  .num { color: var(--suave); font-variant-numeric: tabular-nums; font-size: 12px; min-width: 32px; }
  .hits { margin-left: auto; font-size: 11px; background: var(--acento); color: #000; border-radius: 10px; padding: 0 6px; }
  .vacio { padding: 20px; color: var(--suave); text-align: center; }

  /* ---- Zona principal ---- */
  main { padding: 24px 32px 40px; min-width: 0; }
  .migas { color: var(--suave); font-size: 12px; word-break: break-all; }
  .titulo { display: flex; align-items: center; gap: 12px; flex-wrap: wrap; margin: 4px 0 16px; }
  .titulo h2 { margin: 0; font-size: 24px; }
  .acciones { margin-left: auto; display: flex; gap: 8px; flex-wrap: wrap; }
  .btn { border: 1px solid var(--borde); background: var(--panel); color: var(--texto); padding: 6px 12px; border-radius: 8px; text-decoration: none; font-size: 13px; }
  .btn:hover { border-color: var(--acento); }
  .btn.principal { background: var(--acento); color: #000; border-color: var(--acento); font-weight: 600; }
  .pestanas { display: flex; gap: 2px; }
  .pestana { border: 1px solid var(--borde); border-bottom: 0; background: var(--fondo); color: var(--suave); padding: 6px 14px; border-radius: 8px 8px 0 0; font-family: ui-monospace, Consolas, monospace; font-size: 13px; }
  .pestana.activa { background: var(--codigo); color: #fff; border-color: var(--codigo); }
  body.oscuro .codigo { box-shadow: 0 0 0 1px var(--borde); }
  body.oscuro .pestana.activa { box-shadow: 0 0 0 1px var(--borde); }
  .codigo { position: relative; background: var(--codigo); border-radius: 0 10px 10px 10px; overflow: auto; max-height: 70vh; }
  .codigo pre { margin: 0; }
  .codigo code.hljs { padding: 18px 20px; font: 13.5px/1.6 ui-monospace, Consolas, "Cascadia Code", monospace; background: transparent; tab-size: 4; }
  .codigo .aviso { color: #c9d1d9; padding: 24px; }
  mark { background: var(--marca); color: #000; border-radius: 2px; }

  /* ---- Ejecución ---- */
  .resultado { margin-top: 18px; display: grid; grid-template-columns: 1fr 1fr; gap: 14px; }
  .resultado[hidden] { display: none; }
  .caja { background: var(--panel); border: 1px solid var(--borde); border-radius: 10px; overflow: hidden; display: flex; flex-direction: column; min-height: 260px; }
  .caja h3 { margin: 0; font-size: 12px; text-transform: uppercase; letter-spacing: .04em; color: var(--suave); padding: 8px 12px; border-bottom: 1px solid var(--borde); display: flex; justify-content: space-between; }
  .caja h3 button { border: 0; background: none; color: var(--suave); font-size: 12px; }
  iframe { border: 0; flex: 1; background: #fff; width: 100%; }
  .consola { font: 12.5px/1.5 ui-monospace, Consolas, monospace; overflow: auto; flex: 1; max-height: 420px; }
  .linea { padding: 3px 12px; border-bottom: 1px solid var(--borde); white-space: pre-wrap; word-break: break-word; }
  .linea.warn { background: #fff8e1; color: #7a5b00; }
  .linea.error { background: #ffebee; color: #b00020; }
  body.oscuro .linea.warn { background: #2b2510; color: #f7d046; }
  body.oscuro .linea.error { background: #3a1418; color: #ff8a8a; }
  .consola .nada { padding: 12px; color: var(--suave); }

  @media (max-width: 900px) {
    body { grid-template-columns: 1fr; }
    aside { height: auto; max-height: 45vh; position: static; }
    main { padding: 16px; }
    .resultado { grid-template-columns: 1fr; }
  }
</style>
</head>
<body>
<aside>
  <div class="cabecera">
    <a class="volver" id="volver" href="#">← Mis asignaturas</a>
    <h1><span class="logo" id="logo"></span> <span id="nombre"></span></h1>
    <div class="buscador"><input id="buscar" type="search" placeholder="Buscar tema o código (ej: toFixed)" autocomplete="off"></div>
    <div class="origen" id="origen">⏳ Cargando…</div>
    <div class="ayuda">Atajos: <b>/</b> buscar · <b>←</b> <b>→</b> anterior/siguiente · <b>R</b> ejecutar</div>
  </div>
  <nav id="menu"></nav>
</aside>

<main>
  <div class="migas" id="migas"></div>
  <div class="titulo">
    <h2 id="titulo"></h2>
    <div class="acciones">
      <button class="btn" id="anterior" title="Anterior (←)">← Anterior</button>
      <button class="btn" id="siguiente" title="Siguiente (→)">Siguiente →</button>
      <button class="btn" id="copiar">Copiar</button>
      <a class="btn" id="original" target="_blank">Abrir original ↗</a>
      <a class="btn" id="github" target="_blank">Ver en GitHub ↗</a>
      <button class="btn principal" id="ejecutar" title="Ejecutar (R)">▶ Ejecutar</button>
      <button class="btn" id="tema" title="Cambiar tema">◐</button>
    </div>
  </div>
  <div class="pestanas" id="pestanas"></div>
  <div class="codigo"><pre><code id="codigo" class="hljs"></code></pre></div>

  <div class="resultado" id="resultado" hidden>
    <div class="caja"><h3>Consola <button id="limpiar">Limpiar</button></h3><div class="consola" id="consola"></div></div>
    <div class="caja"><h3>Página</h3><iframe id="marco" sandbox="allow-scripts allow-modals" title="Resultado"></iframe></div>
  </div>
</main>

y>\n<\/html>\n<!--Mario Lallana Campos-->\n<!--IES Virgen del Espino-->\n<!--DAW2 - 2026/27-->"}, {"ruta": "1 sintaxis basica/1.05 COMENTARIOS/comentarios.html", "codigo": "<!DOCTYPE html>\n<html lang=\"en\">\n<head>\n    <meta charset=\"UTF-8\">\n    <meta name=\"viewport\" content=\"width=device-width, initial-scale=1.0\">\n    <title>Document<\/title>\n<\/head>\n<body>\n    <script>\n        //variables\n        let a = 1;//variable para ...\n\n        /*\n            esta operacion realiza la suma para las varibales x\n        */\n\n\n\n    <\/script>\n<\/body>\n<\/html>\n<!--Mario Lallana Campos-->\n<!--IES Virgen del Espino-->\n<!--DAW2 - 2026/27-->"}, {"ruta": "1 sintaxis basica/1.06 VARIABLES/variables.html", "codigo": "<!DOCTYPE html>\n<html lang=\"en\">\n<head>\n    <meta charset=\"UTF-8\">\n    <meta name=\"viewport\" content=\"width=device-width, initial-scale=1.0\">\n    <title>Document<\/title>\n<\/head>\n<body>\n    <script>\n        //VARIABLES EN JAVASRICPT\n        /*\n        - Identificadores únicos\n        - Identificadores descriptivos\n        - Empiezan por letra minúscula, $\n        - Siguen por letras, números ...\n        - Pueden contener cadenas(\"\", '') y numeros(enteros o decimales)\n        - Sensibles a mayúsculas y minúsculas (nombre != Nombre != NOMBRE)\n        - No pueden utilizarse palabras reservadas\n        */\n\n        /*\n        - Declaración de una variable\n        let nombre;\n        let nombre = 'Sergio';\n\n        document.getElementById(\"parrafo1\").innerHTML = nombre;\n\n        let nombre; let apellido; let nacimiento; let pais;\n        let nombre = \"Javier\", apellido = \"García\", nacimiento = 1990; pais = \"España\";\n\n        let nombreApellido = nombre + \" \" + apellido;\n        let fallecimiento = nacimiento + 60;\n\n        document.getElementById(\"parrafo1\").innerHTML = nombreApellido + \" nació en \" + pais + \" en el año \" + nacimiento + \" y falleció en el año \" + fallecimiento;\n        */\n\n    <\/script>\n<\/body>\n<\/html>\n<!--Mario Lallana Campos-->\n<!--IES Virgen del Espino-->\n<!--DAW2 - 2026/27-->"}, {"ruta": "1 sintaxis basica/1.07 OPERADORES ARITMETICOS/operadoresAritmeticos.html", "codigo": "<!DOCTYPE html>\n<html lang=\"en\">\n<head>\n    <meta charset=\"UTF-8\">\n    <meta name=\"viewport\" content=\"width=device-width, initial-scale=1.0\">\n    <title>Document<\/title>\n<\/head>\n<body>\n    <script>\n\n        /*\n        - Operadores unarios\n        let i = 10, j = 5;\n        i = i -1;\n        i--;\n        j = j + 1;\n        j++;\n\n        i += 1; // i = i + 1;\n        j -= 1; // j = j - 1;\n        */\n\n        //\n\n    <\/script>\n<\/body>\n<\/html>\n<!--Mario Lallana Campos-->\n<!--IES Virgen del Espino-->\n<!--DAW2 - 2026/27-->"}, {"ruta": "1 sintaxis basica/1.08 OPERADORES ASIGNACION/operadoresAsignacion.html", "codigo": "<!DOCTYPE html>\n<html lang=\"en\">\n<head>\n    <meta charset=\"UTF-8\">\n    <meta name=\"viewport\" content=\"width=device-width, initial-scale=1.0\">\n    <title>Document<\/title>\n<\/head>\n<body>\n    <script>\n        let x = 10;\n\n        x += 5; // x = x + 5;\n        x -= 6; // x = x - 6;\n        x *= 2; // x = x * 2;\n        x /= 2; // x = x / 2;\n        x %= 1; // x = x % 1;\n\n        \n    <\/script>\n<\/body>\n<\/html>"}, {"ruta": "1 sintaxis basica/1.09 OPERADORES CADENA/operadoresCadena.html", "codigo": "<!DOCTYPE html>\n<html lang=\"en\">\n<head>\n    <meta charset=\"UTF-8\">\n    <meta name=\"viewport\" content=\"width=device-width, initial-scale=1.0\">\n    <title>Document<\/title>\n<\/head>\n<body>\n    <script>\n        let nombre = \"David\";\n        let apellido = \"Martínez\";\n\n        let nombreCompleto = nombre + \" \" + apellido;\n\n        let texto = \"ABCD\";\n        texto += \"EFGH\"; // texto = texto + \"EFGH\";\n\n        let resultado = 4 + \"javier\" + 10;\n        alert(resultado);\n\n    <\/script>\n<\/body>\n<\/html>"}, {"ruta": "1 sintaxis basica/1.10 OPERADORES COMPARACION/operadoresComparacion.html", "codigo": "<!DOCTYPE html>\n<html lang=\"en\">\n<head>\n    <meta charset=\"UTF-8\">\n    <meta name=\"viewport\" content=\"width=device-width, initial-scale=1.0\">\n    <title>Document<\/title>\n<\/head>\n<body>\n    <script>\n        //puebas para operadores de comparacion\n        let a = 5;\n        let b = \"5\";\n        let c = 5;\n\n        console.log(\"a: \" + a);\n        console.log(\"b: '\" + b + \"'\");\n        console.log(\"c: \" + c);\n\n        //comparacion simple\n        console.log(\"Comparacion simple\");\n        console.log(\"a == b: \" + (a == b));\n        console.log(\"a != b: \" + (a != b));\n        console.log(\" \");\n        console.log(\"a == c: \" + (a == c));\n        console.log(\"a != c: \" + (a != c));\n        console.log(\" \");\n        \n        //comparacion estricta\n        console.log(\"Comparacion estricta\");\n        console.log(\"a === b: \" + (a === b));\n        console.log(\"a !== b: \" + (a !== b));\n        console.log(\" \");\n        console.log(\"a === c: \" + (a === c));\n        console.log(\"a !== c: \" + (a !== c));\n        console.log(\" \");\n\n        let d = 10;\n        let e = 2;\n\n        console.log(\"d: \" + d);\n        console.log(\"e: \" + e);\n\n        //comparacion mayor y menor\n        console.log(\"Comparacion mayor y menor\");\n        console.log(\"a > b: \" + (a > b));\n        console.log(\"a < b: \" + (a < b));\n        console.log(\" \");\n        console.log(\"a > c: \" + (a > c));\n        console.log(\"a < c: \" + (a < c));\n        console.log(\" \");\n        console.log(\"a > d: \" + (a > d));\n        console.log(\"a < d: \" + (a < d));\n        console.log(\" \");\n        console.log(\"a > e: \" + (a > e));\n        console.log(\"a < e: \" + (a < e));\n        console.log(\" \");\n\n        //comparacion mayor o igual y menor o igual\n        console.log(\"Comparacion mayor o igual y menor o igual\");\n        console.log(\"a >= b: \" + (a >= b));\n        console.log(\"a <= b: \" + (a <= b));\n        console.log(\" \");\n        console.log(\"a >= c: \" + (a >= c));\n        console.log(\"a <= c: \" + (a <= c));\n        console.log(\" \");\n        console.log(\"a >= d: \" + (a >= d));\n        console.log(\"a <= d: \" + (a <= d));\n        console.log(\" \");\n        console.log(\"a >= e: \" + (a >= e));\n        console.log(\"a <= e: \" + (a <= e));\n        console.log(\" \");\n\n    <\/script>\n<\/body>\n<\/html>"}, {"ruta": "1 sintaxis basica/1.11 OPERADORES LOGICOS/operadoresLogicos.html", "codigo": "<!DOCTYPE html>\n<html lang=\"en\">\n<head>\n    <meta charset=\"UTF-8\">\n    <meta name=\"viewport\" content=\"width=device-width, initial-scale=1.0\">\n    <title>Document<\/title>\n<\/head>\n<body>\n    <script>\n        //AND, OR, NOT\n        let x = 4;\n        let y = 2;\n\n        let resultadoAND = (x<5 && y>1);//true\n        let resultadoOR = (x<5 || y>1);//true\n        let resultadoNOT = !(x==y);//true\n\n        resultadoAND = (x>5 && y>1);//false\n        resultadoOR = (x>5 || y>1);//true\n        resultadoNOT = !(x>=y);//false\n\n        //zona de pruebas\n        let a = 5;\n        let b = 10;\n        let c = 15;\n\n        let resultado;\n        resultado = (!((a<b) && (b<c))|| (a>c));\n        console.log(\"resultado: \" + resultado);\n    <\/script>\n<\/body>\n<\/html>"}, {"ruta": "1 sintaxis basica/1.12 OPERADOR TERNARIO/operadorTernario.html", "codigo": "<!DOCTYPE html>\n<html lang=\"en\">\n<head>\n    <meta charset=\"UTF-8\">\n    <meta name=\"viewport\" content=\"width=device-width, initial-scale=1.0\">\n    <title>Document<\/title>\n<\/head>\n<body>\n    <script>\n        let edad = 17;\n         // condicion ? valor_si_verdadero : valor_si_falso\n        let esMayorDeEdad = (edad >= 18) ? \"Es mayor de edad\" : \"Es menor de edad\";\n        console.log(esMayorDeEdad);\n    <\/script>\n<\/body>\n<\/html>"}, {"ruta": "1 sintaxis basica/1.13 OPERADORES TIPO/operadoresTipo.html", "codigo": "<!DOCTYPE html>\n<html lang=\"en\">\n<head>\n    <meta charset=\"UTF-8\">\n    <meta name=\"viewport\" content=\"width=device-width, initial-scale=1.0\">\n    <title>Document<\/title>\n<\/head>\n<body>\n    <script>\n        // //typeof: devuelve el tipo de dato de una variable\n        // let cadena = \"Hola\";\n        // alert(typeof cadena);//string\n        // let numero = 5;\n        // alert(typeof numero);//number\n        // let booleano = true;\n        // alert(typeof booleano);//boolean\n        // let sinDefinir;\n        // alert(typeof sinDefinir);//undefined\n        // let nulo = null;\n        // alert(typeof nulo);//object\n        // let lista = [1,2,3];\n        // alert(typeof lista);//object\n        // let funcion = function miFuncion(){alert(\"Hola\");};\n        // alert(typeof funcion);//function\n        // let fecha = new Date;\n        // alert(typeof fecha);//object\n        // let registro = {nombre:\"David\", apellido:\"Martínez\", curso:\"DAW2\"};\n        // alert(typeof registro);//object\n\n        //instanceof: devuelve true si un objeto es una instancia de otro objeto especificado\n        let animales = [\"perro\", \"gato\", \"conejo\"];\n        alert(animales instanceof Object);//true\n        alert(animales instanceof Array);//true\n        alert(animales instanceof Number);//false\n        alert(animales instanceof String);//false\n\n        //nulos vs no deifinidos\n        alert(typeof null);//object\n        alert(typeof undefined);//undefined\n        alert(null == undefined);//true\n        alert(null === undefined);//false\n    <\/script>\n<\/body>\n<\/html>"}, {"ruta": "1 sintaxis basica/1.15 FUNCIONES INTRODUCCION/funcionesIntroduccion.html", "codigo": "<!DOCTYPE html>\n<html lang=\"en\">\n<head>\n    <meta charset=\"UTF-8\">\n    <meta name=\"viewport\" content=\"width=device-width, initial-scale=1.0\">\n    <title>Document<\/title>\n<\/head>\n<body>\n    <script>\n        //sintaxis\n        //function nombre_funcion(parametro1, parametro2, ...){...}\n        function saludo(){\n            alert(\"Hola\");\n        }\n\n        let resultado = saludo();\n        alert(resultado);\n        //guardas la funcion en una variable o mostrarla\n        let resultadoSaludoSinParentesis = saludo;\n        alert(resultadoSaludoSinParentesis);\n\n        //funciones con parametros\n        function producto(a,b){\n            return a*b;\n        }\n        let resultadoProducto = producto(5,10);\n        alert(resultadoProducto);\n\n    <\/script>\n<\/body>\n<\/html>"}, {"ruta": "1 sintaxis basica/1.16 FUNCION ANONIMA/funcionAnonima.html", "codigo": "<!DOCTYPE html>\n<html lang=\"en\">\n<head>\n    <meta charset=\"UTF-8\">\n    <meta name=\"viewport\" content=\"width=device-width, initial-scale=1.0\">\n    <title>Document<\/title>\n<\/head>\n<body>\n    <script>\n        let producto = function(a,b){return a*b;}\n        let resultado = producto(1,2);\n        console.log(resultado);\n        console.log(producto);\n\n        //otra forma (mejor no usar)\n        let suma = new Function(\"a\",\"b\",\"return a+b\");\n        console.log(suma(1,2));\n        console.log(suma);\n    <\/script>\n<\/body>\n<\/html>"}, {"ruta": "1 sintaxis basica/1.17 FUNCIONES PARAMETROS/funcionesParametros.html", "codigo": "<!DOCTYPE html>\n<html lang=\"en\">\n<head>\n    <meta charset=\"UTF-8\">\n    <meta name=\"viewport\" content=\"width=device-width, initial-scale=1.0\">\n    <title>funcionesParametros<\/title>\n<\/head>\n<body>\n    <script>\n        /*\n        parametros y argumentos\n        - funcion puede tener 0 o mas argumentos\n        - parametros son los nombre que aparecen en la definicion de la funcion\n        - argumentos son los valores que se pasan a la funcion cuando se llama\n\n        reglas parametros\n        - no se especifican el tipo de los parametros\n        - no se verifica el tipo de los argumentos\n        - no se comprueba el numero de los argumentos recibidos\n\n        parametros por defecto\n        - cuando llamamos a una funcion con menos argumentos de los declarados, los valores que faltan no estan definidos (undefined)\n        */\n\n        function suma(a,b){\n            if(a === undefined){\n                a = 1;\n            }\n            if(b === undefined){\n                b = 2;\n            }\n            return a+b;\n        }\n\n        console.log(suma(3));\n\n        /*\n        parametros por exceso\n        - cuando llamamos una funcion coin mas argumentos de los declarados, los valores que llegan pueden capturarse con el objeto arguments\n        */\n\n        function valores(){\n            console.log(\"El numero de argumentos es: \"+arguments.length);\n            for(let i=0; i<arguments.length; i++){\n                console.log(\"Argumento \"+i+\" es: \"+arguments[i]);\n            }\n        }\n\n        valores(1,2,3,4,5);\n    <\/script>    \n<\/body>\n<\/html>"}, {"ruta": "1 sintaxis basica/1.18 AMBITO VARIABLES/ambitoVariables.html", "codigo": "<!DOCTYPE html>\n<html lang=\"en\">\n<head>\n    <meta charset=\"UTF-8\">\n    <meta name=\"viewport\" content=\"width=device-width, initial-scale=1.0\">\n    <title>Document<\/title>\n<\/head>\n<body>\n    <script>\n        /*VARIABLES LOCALES\n        -se definien dentro de una funcion \n        -tienen ámbito local en la función\n        -únicamente son accesibles dentro de la función\n        -desaparece cuando finaliza la función\n        -podemos declarar variables con el mismo nombre en diferentes funciones\n        */\n\n        function saludar(){\n            let saludo = \"Hola\";\n            alert(saludo);\n        }\n        saludar();\n        //alert(saludo); //error\n\n        /*VARIABLES GLOBALES\n        -se definen fuera de las funciones\n        -tienen ámbito global\n        -son accesibles desde dentro y fuera de las funciones\n        -desaparecen cuando se termina de ejecutar el código\n        */\n\n        let despedida = \"Adiós\";\n        function despedir(){\n            alert(despedida);\n        }\n        despedir();\n        alert(despedida);\n\n        //VARIABLES AUTOÁTICAMENTE GLOBALES\n\n        function preguntar(){\n            pregunta = \"¿Qué día es hoy?\";\n            alert(pregunta);\n        }\n        preguntar();\n        alert(pregunta);\n\n        //VARIABLES LOCALES Y GLOBALES CON EL MISMO NOMBRE\n\n        let var1 = \"Fuera\";\n        function lugar(){\n            let var1 = \"Dentro\";\n            alert(var1);\n        }\n        lugar();\n        alert(var1);\n\n        //VARIABLE GLOBAL REDEFINIDA DENTRO DE UNA FUNCIÓN\n\n        let var2 = \"out\";\n        function lugar2(){\n            var2 = \"in\";\n            alert(var2);\n        }\n        alert(var2);\n        lugar2();\n        alert(var2);\n    <\/script>\n<\/body>\n<\/html>"}, {"ruta": "1 sintaxis basica/1.19 CONDICIONAL IFELSE/condicionalesifElse.html", "codigo": "<!DOCTYPE html>\n<html lang=\"en\">\n<head>\n    <meta charset=\"UTF-8\">\n    <meta name=\"viewport\" content=\"width=device-width, initial-scale=1.0\">\n    <title>Document<\/title>\n<\/head>\n<body>\n    <script>\n        /*\n        if(condicion){ instrucciones };\n\n        if(nota>=5){\n            alert(\"Aprobado\");\n        }\n\n        if(nota>=5){\n            alert(\"Aprobado\");\n        }else{\n            alert(\"Suspenso\");\n        }\n\n        if(nota<5){\n            alert(\"Suspenso\");\n        }elseif(nota==5){\n            alert(\"Aprobado\");\n        }elseif(nota==6){\n            alert(\"Bien\");\n        }elseif(nota==7 || nota==8){\n            alert(\"Notable\");\n        }else{\n            alert(\"Sobresaliente\");\n        }\n        */\n    <\/script>\n<\/body>\n<\/html>"}, {"ruta": "1 sintaxis basica/1.20 CONDICIONAL SWITCH/condicionalesSwitch.html", "codigo": "<!DOCTYPE html>\n<html lang=\"en\">\n<head>\n    <meta charset=\"UTF-8\">\n    <meta name=\"viewport\" content=\"width=device-width, initial-scale=1.0\">\n    <title>Document<\/title>\n<\/head>\n<body>\n    <script>\n        /*\n        -se utiliza para hacer diferentes acciones basadas en diferentes condiciones\n        -la condición se evalúa una sola vez\n\n        switch(expresion){\n            case valor1:\n                instrucciones;\n                break;\n            case valor2:\n                instrucciones;\n                break;\n            default:\n                instrucciones;\n        }\n        */\n\n        let nota = 8;\n        switch(nota){\n            case 5:\n                alert(\"Aprobado\");\n                break;\n            case 6:\n                alert(\"Bien\");\n                break;\n            case 7 && 8:\n                alert(\"Notable\");\n                break;\n            case 9 && 10:\n                alert(\"Sobresaliente\");\n                break;\n            default:\n                alert(\"Suspenso\");\n        }\n    <\/script>\n<\/body>\n<\/html>"}, {"ruta": "1 sintaxis basica/1.21 BUCLE FOR/bucleFor.html", "codigo": "<!DOCTYPE html>\n<html lang=\"en\">\n<head>\n    <meta charset=\"UTF-8\">\n    <meta name=\"viewport\" content=\"width=device-width, initial-scale=1.0\">\n    <title>Document<\/title>\n<\/head>\n<body>\n    <script>\n        /*\n        for(sentencia1; sentencia2; sentencia3){\n            instrucciones;\n        }\n\n        -sentencia1: se ejecuta antes de que empieze el codigo\n        -sentencia2: condicion por la que el bloque de codigo se ejecuta\n        -sentencia3: se ejecuta despues de que acabe el bloque de codigo\n\n        for(i=0; i<10; i++){\n            alert(i);\n        }\n\n        VARIACIONES:\n        1. si omitimos la primera sentencia debemos haber inicializado la variable antes del bucle\n        let i=0;\n        for(; i<10; i++){\n            alert(i);\n        }\n\n        2.si omitimos la segunda sentencia, dentro del codigo debemos poner una sentencia break para que el bucle no sea infinito\n        for(i=0; ; i++){\n            alert(i);\n            if(i==10){\n                break;\n            }\n        }\n        \n        3.si omitimos la tercera sentencia, debemos incrementar/decrementar la variable dentro del bloque de codigo\n        for(i=0; i<10;){\n            alert(i);\n            i++;\n        }\n\n        4. podemos trabajar con 2/mas variables dentro del bucle for\n        for(i=0, j=10; i<10, j>0; i++, j--){\n            alert(i + \" \" + j);\n        }\n        */\n       for(i=0, j=10; i<10, j>0; i++, j--){\n            console.log(i + \" \" + j);\n        }\n    <\/script>\n<\/body>\n<\/html>"}, {"ruta": "1 sintaxis basica/1.22 BUCLE FORIN/bucleForIn.html", "codigo": "<!DOCTYPE html>\n<html lang=\"en\">\n<head>\n    <meta charset=\"UTF-8\">\n    <meta name=\"viewport\" content=\"width=device-width, initial-scale=1.0\">\n    <title>Document<\/title>\n<\/head>\n<body>\n    <script>\n        let coche = {marca: 'ford', modelo: 'puma', año: 1990};\n        \n        for(x in coche){\n            console.log(coche[x]);\n        }\n    <\/script>\n<\/body>\n<\/html>"}, {"ruta": "1 sintaxis basica/1.23 BUCLE WHILE/bucleWhile.html", "codigo": "<!DOCTYPE html>\n<html lang=\"en\">\n<head>\n    <meta charset=\"UTF-8\">\n    <meta name=\"viewport\" content=\"width=device-width, initial-scale=1.0\">\n    <title>Document<\/title>\n<\/head>\n<body>\n    <script>\n        /*\n        while(condicion){\n            codigo a ejecutar\n        }\n        */\n        let i = 0;\n        while(i<10){\n            console.log(\"i = \"+i);\n            i++;\n        }\n        \n        /*\n        do{\n            codigo a ejecutar\n        }while(condicion);\n        */\n       let j = 10;\n        do{\n            console.log(\"j = \"+j);\n            j++;\n        }while(j<10);\n    <\/script>\n<\/body>\n<\/html>"}, {"ruta": "1 sintaxis basica/1.24 SALTOS BREAK CONTINUE/saltosBreakContinue.html", "codigo": "<!DOCTYPE html>\n<html lang=\"en\">\n<head>\n    <meta charset=\"UTF-8\">\n    <meta name=\"viewport\" content=\"width=device-width, initial-scale=1.0\">\n    <title>Document<\/title>\n<\/head>\n<body>\n    <script>\n        /*\n        break: salir o saltar fuera de un bucle, finalizandolo\n        */\n\n        for (i=0;i<10;i++){\n            if(i==3){\n                break;\n            }\n            console.log(\"i = \"+i);\n        }\n\n        /*\n        continue: salta hasta la siguiente iteracion del bucle\n        */\n\n        for(j=0; j<10;j++){\n            if( j==3 || j==6 ){\n                continue;\n            }\n            console.log(\"j = \"+j);    \n        }\n\n        /*\n        etiquetas: \n        */\n\n        let animales = [\"perro\",\"gato\",\"conejo\"];\n\n        consulta_animales:\n        {\n            console.log(animales[0]);\n            break consulta_animales;\n            console.log(animales[1]);\n            console.log(animales[2]);\n        };\n\n        bucle:\n            for(i=1;i<6;i++){\n                if(i==3){\n                    continue bucle;\n                }\n                console.log(\"i = \"+i);\n            }\n        \n    <\/script>\n<\/body>\n<\/html>"}, {"ruta": "2 Objetos nativos y operadores de funcion/1.01 OBJETOS INTRODUCCION/objetosIntroduccion.html", "codigo": "<!DOCTYPE html>\n<html lang=\"en\">\n<head>\n    <meta charset=\"UTF-8\">\n    <meta name=\"viewport\" content=\"width=device-width, initial-scale=1.0\">\n    <title>Document<\/title>\n<\/head>\n<body>\n    <script>\n        //DATOS PRIMITIVOS\n        let cadena = \"DAW\";\n        let pi = 3.14;\n        let bool = true;\n        let nodefinido = undefined;\n        let nulo = null;\n\n        /*\n        OBJETOS NATIVOS: no dependen del navegadoR\n        - Array\n        - Function\n        - Number\n        - String\n        - Boolean\n        - Object\n        - Date\n        - RegExp (expresiones regulares)\n        */\n\n        /*\n        OBJETOS DE ALTO NIVEL: si dependen del navegador\n        - Document\n        - Window\n        - Navigator\n        - Location\n        - History\n        - Screen\n        */\n\n        /*\n        DEFINICION DE OBJETO\n        - Propiedades: atributos de un objeto. Se definen en modo nombre-valor\n        - Metodos: acciones que se pueden ejecutar sobre un objeto\n        */\n\n        let programador = {nombre:\"David\", apellido:\"Lafuente\", año: 1825};\n    <\/script>\n<\/body>\n<\/html>"}, {"ruta": "2 Objetos nativos y operadores de funcion/1.02 CONSTRUCTORES INTEGRADOS/contructoresIntegrados.html", "codigo": "<!DOCTYPE html>\n<html lang=\"en\">\n<head>\n    <meta charset=\"UTF-8\">\n    <meta name=\"viewport\" content=\"width=device-width, initial-scale=1.0\">\n    <title>Document<\/title>\n<\/head>\n<body>\n    <script>\n        //1. String:\n        let cadena1 = \"DAW2\";\n        let cadena2 = new String();\n\n        //2. Number:\n        let numero1 = 3.14;\n        let numero2 = new Number();\n\n        //3. Boolean:\n        let booleano1 = true;\n        let booleano2 = new Boolean();\n\n        //4. Array:\n        let array1 = [];\n        let array2 = new Array();\n\n        //5. RegExp:\n        let expresion1 = /a/;\n        let expresion2 = new RegExp();\n\n        //6. Function:\n        let funcion1 = function(){};\n        let funcion2 = new Function();\n\n        //7. Date:\n        let fecha = new Date();\n\n        //8. Math:\n        let aleatorio = Math.PI;\n\n        //9. Object:\n        let objetoPersona = {};\n    <\/script>\n<\/body>\n<\/html>"}, {"ruta": "2 Objetos nativos y operadores de funcion/1.03 OBJETO NATIVO STRING/objetoString.html", "codigo": "<!DOCTYPE html>\n<html lang=\"en\">\n<head>\n    <meta charset=\"UTF-8\">\n    <meta name=\"viewport\" content=\"width=device-width, initial-scale=1.0\">\n    <title>Document<\/title>\n<\/head>\n<body>\n    <script>\n        //INSTANCIACION\n        let daw = \"Desarrollo de Aplicaciones Web\";//doble comilla\n        let dam = 'Desarrollo de Aplicaciones Multiplataforma';//comilla simple\n        let asir = \"Administracion de Sistemas Informáticos en Red: 'ASIR' \";\n        let smr = \"Sistemas Microinformaticos y Redes: \\\"SMR\\\" \";\n        let ciclos = new String(\"\");\n\n        ciclos += \"Hay 3 ciclos de grado superior: \\n\";\n        ciclos += daw +\", \"+ dam +\", \"+ asir +\"\\n\";\n        ciclos += \"Hay 1 ciclo de grado medio: \\n\";\n        ciclos += smr +\"\\n\";\n        console.log(ciclos);\n\n        //PROPIEDADES\n        //length\n        console.log(\"Numero de caracteres en ciclos: \" + ciclos.length);\n        \n        //METODOS\n        //- Búsqueda\n        //CharAt: devuelve el caracter en la posición indicada\n        console.log(\"Caracter en la posición 5: \" + ciclos.charAt(5));\n        //indexOf: devuelve la posición de la primera aparición de un caracter o cadena\n        console.log(\"Posición de la primera aparición de 'ciclos': \" + ciclos.indexOf(\"ciclos\"));\n        //lastIndexOf: devuelve la posición de la última aparición de un caracter o cadena\n        console.log(\"Posición de la última aparición de 'ciclos': \" + ciclos.lastIndexOf(\"ciclos\"));\n        // search: devuelve la posición de la primera aparición de un caracter o cadena, pero con expresiones regulares\n        console.log(\"Posición de la primera aparición de 'ciclos' con expresiones regulares: \" + ciclos.search(/ciclos/));\n        // match: devuelve un array con todas las apariciones de un caracter o cadena, pero con expresiones regulares\n        console.log(\"Apariciones de 'ciclos' con expresiones regulares: \" + ciclos.match(/ciclos/g));\n\n        //- Comparación\n        //localCompare(cadena): devuelve -1(antes), 0(igual) o 1(depués)\n        console.log(\"Comparación de 'ciclos' con 'ciclos': \" + daw.localeCompare(dam));\n\n        //- Incluye, emppieza o termina\n        //includes(cadena): devuelve true si la cadena contiene la cadena indicada, false en caso contrario\n        console.log(\"¿La cadena contiene 'ciclos'? \" + ciclos.includes(\"ciclos\"));\n        //startsWith(cadena): devuelve true si la cadena empieza con la cadena indicada, false en caso contrario\n        console.log(\"¿La cadena empieza con 'ciclos'? \" + ciclos.startsWith(\"ciclos\"));\n        //endsWith(cadena): devuelve true si la cadena termina con la cadena indicada, false en caso contrario\n        console.log(\"¿La cadena termina con 'ciclos'? \" + ciclos.endsWith(\"ciclos\"));\n\n        //- Concatenación y repetición\n        //concat(cadena): devuelve la concatenación de la cadena con la cadena indicada\n        console.log(\"Concatenación de 'ciclos' con 'ciclos': \" + ciclos.concat(\"ciclos\"));\n        //repeat(cantidad): devuelve la cadena repetida la cantidad de veces indicada\n        console.log(\"Repetición de 'ciclos' 3 veces: \" + ciclos.repeat(3));\n\n        //- Extracción\n        //slice(inicio, fin): devuelve una parte de la cadena\n        console.log(\"Parte de la cadena desde la posición 0 hasta la 5: \" + ciclos.slice(0, 5));\n        //substring(inicio, fin): devuelve una parte de la cadena\n        console.log(\"Parte de la cadena desde la posición 0 hasta la 5: \" + ciclos.substring(0, 5));\n        //substr(inicio, longitud): devuelve una parte de la cadena\n        console.log(\"Parte de la cadena desde la posición 0 y con longitud 5: \" + ciclos.substr(0, 5));\n\n        //- Mayúsculas\n        console.log(\"Cadena en mayúsculas: \" + ciclos.toUpperCase());\n        //- Minúsculas\n        console.log(\"Cadena en minúsculas: \" + ciclos.toLowerCase());\n        //- Eliminación de espacios en blanco\n        console.log(\"Cadena sin espacios en blanco: \" + ciclos.trim());\n    <\/script>\n<\/body>\n<\/html>"}, {"ruta": "2 Objetos nativos y operadores de funcion/1.04 OBJETO NATIVO NUMBER/objetoNumber.html", "codigo": "<!DOCTYPE html>\n<html lang=\"en\">\n<head>\n    <meta charset=\"UTF-8\">\n    <meta name=\"viewport\" content=\"width=device-width, initial-scale=1.0\">\n    <title>Document<\/title>\n<\/head>\n<body>\n    <script>\n        /*\n        CARACTERISTICAS\n        - Solo hay un tipo de dato numerico\n        - Podemos representar: 34, 34.05, 123e4 123e-4, 0xFF\n\n        CAMBIOS DE BASE ENTRE NUMEROS\n        - toString()\n        */\n\n        let base10 = 128;\n        console.log(base10 + \" en base 2 es: \" + base10.toString(2));\n        console.log(base10 + \" en base 8 es: \" + base10.toString(8));\n        console.log(base10 + \" en base 16 es: \" + base10.toString(16));\n\n        //INFINITO Y -INFINITO\n        // - Infinity y -Infinity\n        let inf = 2;\n        while(inf != Infinity){\n            console.log(inf);\n            inf *= inf; //inf = inf * inf\n        }\n\n        let div1 = 2, div2 = 0;\n        console.log(\"Division 2/0 = \" + div1/div2);\n        console.log(\"Division -2/0 = \" + -div1/div2);\n        console.log(\"Typeof: \" + typeof(div1/div2));\n\n        //NOT A NUMBER: NaN\n        let valor1 = 100/\"casa\";\n        let valor2 = 100/\"10\";\n        console.log(\"100/'casa' = \" + valor1);\n        console.log(\"100/'10' = \" + valor2);\n        console.log(\"¿Es NaN valor1? \" +isNaN(valor1));\n        console.log(\"¿Que tipo es NaN? \" +typeof(valor1));\n        \n        //NUMEROS COMO OBJETOS\n        let num1 = 100;\n        let num2 = new Number(100);\n        let num3 = new Number(100);\n\n        console.log(\"num1: \" + typeof(num1));\n        console.log(\"num2: \" + typeof(num2));\n        \n        console.log(\"num1 == num2: \" + num1 == num2);\n        console.log(\"num1 === num2: \" + (num1 === num2));\n        console.log(\"num2 === num3: \" + (num2 === num3));\n\n        //PROPIEDADES\n        let numMax = Number.MAX_VALUE;\n        console.log(\"MAX_VALUE: \"+numMax);\n        let numMin = Number.MIN_VALUE;\n        console.log(\"MIN_VALUE: \"+numMin);\n        let posInfinito = Number.POSITIVE_INFINITY;\n        console.log(\"POSITIVE_INFINITY: \"+posInfinito);\n        let negInfinito = Number.NEGATIVE_INFINITY;\n        console.log(\"NEGATIVE_INFINITY: \"+negInfinito);\n        let numNaN = Number.NaN;\n        console.log(\"NaN: \"+numNaN);\n\n        //METODOS\n        // toFixed(num_decimales): devuelve un string con el numero con el numero de decimales indicado\n        let x = 9.4768;\n        console.log(\"x con 0 decimales: \" + x.toFixed(0));\n        console.log(\"x con 2 decimales: \" + x.toFixed(2));\n\n        // toPrecision(num_cifras): devuelve un string con el numero con el numero de cifras indicado\n        console.log(\"x con 0 cifras: \" + x.toPrecision());\n        console.log(\"x con 2 cifras: \" + x.toPrecision(2));\n        console.log(\"x con 7 cifras: \" + x.toPrecision(7));\n\n        // toExponential(num_decimales): devuelve un string con el numero en notacion cientifica con el numero de decimales indicado\n        let y = 1234567890;\n        console.log(\"y en notacion cientifica con 0 decimales: \" + y.toExponential(0));\n        console.log(\"y en notacion cientifica con 2 decimales: \" + y.toExponential(2));\n\n        //valorOf(): devuelve el valor primitivo del objeto Number\n\n        // toString(): devuelve un string con el valor del objeto Number\n        let j = 123;\n        console.log(\"j.toString(): \" + j.toString());\n        console.log(typeof(j.toString()));\n        console.log((123).toString());\n        console.log(typeof((123).toString(2)));\n\n        //METODOS GLOBALES PARA CONVERTIR VARIBALES en NUMEROS\n        // Number(): devuelve un numero a partir de un string o un booleano\n        console.log(Number(true));\n        console.log(Number(false));\n        console.log(Number(new Date()));\n        console.log(Number(\"10\"));\n        console.log(Number(\"casa\"));\n\n        //parseInt() / parseFloat()\n        console.log(parseInt(\"10.6\"));\n        console.log(parseInt(\"10 20\"));\n        console.log(parseInt(\"10 casa\"));\n        console.log(parseInt(\"casa 10\"));\n\n        console.log(parseFloat(\"10.6\"));\n        console.log(parseFloat(\"10 20\"));\n        console.log(parseFloat(\"10 casa\"));\n        console.log(parseFloat(\"casa 10\"));\n    <\/script>\n<\/body>\n<\/html>"}, {"ruta": "2 Objetos nativos y operadores de funcion/1.05 OBJETO NATIVO MATH/objetoMath.html", "codigo": "<!DOCTYPE html>\n<html lang=\"en\">\n<head>\n    <meta charset=\"UTF-8\">\n    <meta name=\"viewport\" content=\"width=device-width, initial-scale=1.0\">\n    <title>objetoMath<\/title>\n<\/head>\n<body>\n    <script>\n        /*\n        CARACTERISTICAS\n        - Permite realizar operaciones matematicas\n        - No existe el constructor new Math()\n\n        PROPIEDADES\n        */\n       let pi = Math.PI;\n       console.log(\"PI: \" + pi);\n       let e = Math.E;\n       console.log(\"E: \" + e);\n       let ln2 = Math.LN2;\n       console.log(\"LN2: \" + ln2);\n       let ln10 = Math.LN10;\n       console.log(\"LN10: \" + ln10);\n\n       //METODOS\n       //random(): devuelve un numero aleatorio entre 0 y 1\n       console.log(\"num aleatorio: \"+Math.random());\n       console.log(\"numero aleatorio entre 0 y 9: \"+Math.floor(Math.random()*10));\n\n       //max(lista de valores)/ min(lista de valores)\n       console.log(\"Num max\" + Math.max(1, 2, 6, 12, 9, 3));\n       console.log(\"Num min\" + Math.min(1, 2, 6, 12, 9, 3));\n\n       //round(num): redondea al entero mas cercano\n       console.log(\"Redondeo: \" + Math.round(3.5));\n       console.log(\"Redondeo: \" + Math.round(3.4));\n       console.log(\"Redondeo: \" + Math.round(3.6));\n\n        //ceil(num): redondea al entero superior\n        console.log(\"Redondeo: \" + Math.ceil(3.5));\n\n        //floor(num): redondea al entero inferior\n        console.log(\"Redondeo: \" + Math.floor(3.5));\n\n        //pow(base, exponente): devuelve el valor de la base elevado al exponente\n        console.log(\"Potencia: \" + Math.pow(2, 3));\n\n        //sqrt(num): devuelve la raiz cuadrada de num\n        console.log(\"Raiz cuadrada: \" + Math.sqrt(9));\n\n        //abs(num): devuelve el valor absoluto de num\n        console.log(\"Valor absoluto: \" + Math.abs(5));\n        console.log(\"Valor absoluto: \" + Math.abs(-5));\n\n        //Metodos trigonometricos\n        // sin, cos, tan, asin, acos, atan\n    <\/script>\n<\/body>\n<\/html>"}, {"ruta": "2 Objetos nativos y operadores de funcion/1.06 OBJETO NATIVO DATE/libreriaMoments.html", "codigo": "<!DOCTYPE html>\n<html lang=\"en\">\n<head>\n    <meta charset=\"UTF-8\">\n    <meta name=\"viewport\" content=\"width=device-width, initial-scale=1.0\">\n    <title>libreriaMoments<\/title>\n    <script src=\"momentsjs.js\"><\/script>\n<\/head>\n<body>\n    <script>\n        //creacion de fecha actual \n        console.log(moment().format(\"\"));\n        console.log(moment().format(\"DD-MM-YYYY\"));\n        console.log(moment().format(\"dddd\"));\n        console.log(moment().format(\"MMMM\"));\n\n        let fecha = moment(\"2026-11-11\",\"YYYY-MM-DD\");\n        console.log(fecha.format());\n\n        //añadir 1 dia a la fecha\n        fecha.add(1, 'days');\n        fecha.add(1, 'months');\n        fecha.add(1, 'years');\n        fecha.add(1, 'weeks');\n        fecha.add(1, 'hours');\n        fecha.add(1, 'minutes');\n        fecha.add(1, 'seconds');\n        fecha.add(1, 'milliseconds');\n\n        //restar 1 dia a la fecha\n        fecha.subtract(1, 'days');\n        fecha.subtract(1, 'months');\n        fecha.subtract(1, 'years');\n        fecha.subtract(1, 'weeks');\n        fecha.subtract(1, 'hours');\n        fecha.subtract(1, 'minutes');\n        fecha.subtract(1, 'seconds');\n        fecha.subtract(1, 'milliseconds');\n\n        console.log(fecha.format(\"DD-MM-YYYY\"));\n\n        //calculo entre fechas\n        let fechaInicio = moment(\"01/10/ onds(45);\n        fecha.setMilliseconds(500);\n        console.log(fecha.toString());\n\n        //calculos de fechas\n        let fecha2 = new Date();\n        console.log(fecha2.toString(fecha.setMonth(fecha.getMonth() +3)));//sumas 3 meses a la fecha actual\n    <\/script>\n<\/body>\n<\/html>"}, {"ruta": "3 objetos y arrays/Objetos/01 objetosDefinicion.html", "codigo": "<!DOCTYPE html>\n<html lang=\"en\">\n<head>\n    <meta charset=\"UTF-8\">\n    <meta name=\"viewport\" content=\"width=device-width, initial-scale=1.0\">\n    <title>objetosDefinicion<\/title>\n<\/head>\n<body>\n    <script>\n        //1. definir y crear un objeto simple utilizando un literal\n        let persona1 = {\n            nombre: \"Francisco\",\n            apellido: \"Sanchez\",\n            anio: 1990\n        }\n\n        //2. definir y crear un objeto simple utilizando la palabra new\n        let persona2 = new Object();\n        persona2.nombre = \"Carlos\";\n        persona2.apellido = \"Gonzalez\";\n        persona2.anio = 1991;\n\n        //3. definir un constructor de un objeto y crear objetos del tipo\n        function Persona(nombre, apellido, anio){\n            this.nombre = nombre;\n            this.apellido = apellido;\n            this.anio = anio;\n        }\n\n        let persona3 = new Persona(\"Pedro\", \"Martinez\", 1992);\n        console.log(persona1);\n        console.log(persona2);\n        console.log(persona3);\n    <\/script>\n<\/body>\n<\/html>"}, {"ruta": "3 objetos y arrays/Objetos/02 objetosPropiedades.html", "codigo": "<!DOCTYPE html>\n<html lang=\"en\">\n<head>\n    <meta charset=\"UTF-8\">\n    <meta name=\"viewport\" content=\"width=device-width, initial-scale=1.0\">\n    <title>objetosPropiedades<\/title>\n<\/head>\n<body>\n    <script>\n        //sintaxis de acceso a las propiedades de un objeto\n        //1. objeto.propiedad;\n        //2. objeto[\"propiedad\"];\n        //3. objeto[expresion];\n\n        let persona1 = {nombre: \"Javier\", apellido: \"Gonzalez\", anio: 1990};\n        let persona2 = {nombre: \"x\", apellido: \"y\", anio: 1234};\n        console.log(persona1.nombre);\n        console.log(persona1[\"apellido\"]);\n        let expersion = \"anio\";\n        console.log(persona1[expersion]);\n\n        //recorrer las propiedades de un objeto\n        //for(nom_variable in nom_objeto){\n        //    nom_objeto[nom_variable];\n        //}\n\n        for(x in persona1){\n            console.log(persona1[x]);\n        }\n\n        //añadir propiedades a un objeto\n        //nom_objeto.nom_propiedad = valor;\n        persona1.nacionalidad = \"Española\";\n        for(x in persona1){\n            console.log(persona1[x]);\n        }\n        for(x in persona2){\n            console.log(persona2[x]);\n        }\n\n        //eliminar propiedades de un objeto\n        //delete nom_objeto.nom_propiedad;\n        delete persona1.anio;\n        for(x in persona1){\n            console.log(persona1[x]);\n        }\n    <\/script>\n<\/body>\n<\/html>"}, {"ruta": "3 objetos y arrays/Objetos/03 objetosMetodos.html", "codigo": "<!DOCTYPE html>\n<html lang=\"en\">\n<head>\n    <meta charset=\"UTF-8\">\n    <meta name=\"viewport\" content=\"width=device-width, initial-scale=1.0\">\n    <title>objetosMetodos<\/title>\n<\/head>\n<body>\n    <script>\n        //sintaxis de creacion de metodos de un objeto\n        // nom_metodo:function(){\n        //    instrucciones\n        //}\n\n        let persona1 = {\n            nombre: \"Javier\",\n            apellido: \"Gonzalez\",\n            anio: 1990,\n            nombreCompleto: function(){\n                return this.nombre + \" \" + this.apellido;\n            }\n        }\n\n        console.log(persona1.nombreCompleto());\n    <\/script>\n<\/body>\n<\/html>"}, {"ruta": "3 objetos y arrays/Objetos/04 objetosPrototipos.html", "codigo": "<!DOCTYPE html>\n<html lang=\"en\">\n<head>\n    <meta charset=\"UTF-8\">\n    <meta name=\"viewport\" content=\"width=device-width, initial-scale=1.0\">\n    <title>objetosPrototipos<\/title>\n<\/head>\n<body>\n    <script>\n        //crear objeto mediante constructor: persona\n        //tiene nombre, apellido anio, muerte\n        //funcion nombreCompleto\n\n        function Persona(nombre, apellido, anioNac, anioMue){\n            this.nombre = nombre;\n            this.apellido = apellido;\n            this.anioNac = anioNac;\n            this.anioMue = anioMue;\n\n            this.nombreCompleto = function(){\n                return this.nombre + \" \" + this.apellido;\n            }\n\n            this.edadMuerte = function(){\n                return this.anioMue - this.anioNac;\n            }\n        }\n\n        let p1 = new Persona(\"Ugo\", \"Dominguez\", 1934, 2000);\n        let p2 = new Persona(\"Jorge\", \"Esteban\", 1872, 1940);\n\n        p1.nacionalidad = \"Española\";\n        // console.log(p1.nacionalidad);\n        // console.log(p2.nacionalidad);\n\n        // for(x in p1){\n        //     console.log(p1[x]);\n        // }\n\n        // for(x in p2){\n        //     console.log(p2[x]);\n        // }\n\n        console.log(p1.nombreCompleto()+\" murió a los \"+p1.edadMuerte());\n        console.log(p2.nombreCompleto()+\" murió a los \"+p2.edadMuerte());\n\n        p1.provincia = \"Jaen\"//da el valor a un nuevo atributo solo para p1\n\n        Persona.prototype.provincia = \"Soria\";//da el valor a un nuevo atributo para todos los tipos Persona\n\n        for(x in p2){\n            console.log(p2[x]);\n        }\n\n        p1.nacimiento = function(){//añade el metodo solo a una persona\n            return \"El naciemiento de \"+p1.nombreCompleto+\" fue en \"+this.anioNac;\n        }\n\n        Persona.prototype.nacimiento = function(){//añadimos el metodo nacimiento a todos los tipo persona\n            return \"El naciemiento de \"+p1.nombreCompleto+\" fue en \"+this.anioNac;\n        }\n\n        console.log(p1.nacimiento());\n\n    <\/script>\n<\/body>\n<\/html>"}, {"r let LECCIONES = [];

const $ = id => document.getElementById(id);
const estado = { leccion: 0, archivo: 0, filtro: "" };

// localStorage puede fallar (modo privado, file:// en algunos navegadores): nunca debe romper la página
const guardar = (k, v) => { try { localStorage.setItem(k, v); } catch (e) {} };
const leerGuardado = k => { try { return localStorage.getItem(k); } catch (e) { return null; } };

const escapar = s => s.replace(/[&<>"]/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));
const nombreBloque = b => b.replace(/^\d+\s*/, "").replace(/^./, c => c.toUpperCase());
const contar = (texto, q) => q ? texto.toLowerCase().split(q).length - 1 : 0;

// ---------- Configuración ----------
// titulo/logo: cabecera · usuario/repo/carpeta: de dónde leer en GitHub al abrirlo con doble clic
// porParametro: la carpeta se elige con ?asignatura=... (explorador de asignaturas)
const CONFIG = {"titulo": "Apuntes de JavaScript", "logo": "JS", "usuario": "lallana14", "repo": "carpetaCompartida", "carpeta": "cliente/APUNTES", "porParametro": false};

// ---------- Agrupar archivos en temas ----------
const LIBRERIA_BYTES = 50000; // archivos más grandes (p. ej. moment.js) se ejecutan pero no se muestran
const LENGUAJES = { html: "html", htm: "html", js: "javascript", css: "css", php: "php", sql: "sql",
                    txt: "plaintext", json: "json", md: "markdown", xml: "xml" };
const PAGINAS = ["html", "htm", "php"]; // archivos que son "una página" (el resto se agrupa con ellas)
const natural = new Intl.Collator("es", { numeric: true, sensitivity: "base" }).compare; // "1.10" va después de "1.9"
const extension = n => n.split(".").pop().toLowerCase();
const sinExtension = n => n.replace(/\.[^.]+$/, "");
const esPagina = n => PAGINAS.includes(extension(n));
const tituloBonito = n => n.replace(/^[\d.]+\s*/, "").replace(/([a-z])([A-Z])/g, "$1 $2").trim()
  .toLowerCase().replace(/^./, c => c.toUpperCase());

// Solo se ejecuta lo que el navegador entiende por sí mismo: HTML y JavaScript (nunca PHP)
function ejecutable(ficheros) {
  const exts = ficheros.map(f => extension(f.nombre));
  return exts[0] === "html" || exts[0] === "htm" || (exts[0] === "js" && !exts.includes("php"));
}

function agrupar(archivos) {
  const porCarpeta = new Map();
  for (const a of archivos) {
    if (!LENGUAJES[extension(a.ruta)]) continue;
    const corte = a.ruta.lastIndexOf("/");
    const carpeta = corte < 0 ? "" : a.ruta.slice(0, corte);
    if (!porCarpeta.has(carpeta)) porCarpeta.set(carpeta, []);
    porCarpeta.get(carpeta).push({ ...a, nombre: a.ruta.slice(corte + 1) });
  }
  const carpetas = [...porCarpeta.keys()].sort(natural);
  const lecciones = [];
  const crear = (carpeta, nombre, grupo, porArchivo) => {
    const partes = carpeta ? carpeta.split("/") : [];
    const ultima = partes[partes.length - 1] || "";
    const tieneSubcarpetas = carpetas.some(c => carpeta && c.startsWith(carpeta + "/"));
    grupo.sort((x, y) => !esPagina(x.nombre) - !esPagina(y.nombre)); // la página primero
    lecciones.push({
      id: lecciones.length,
      bloque: partes[0] || "",
      seccion: partes.length > 1 && (nombre !== partes[1] || tieneSubcarpetas) ? partes[1] : "",
      numero: (nombre.match(/^[\d.]+/) || ultima.match(/^[\d.]+/) || [""])[0].replace(/[.\s]+$/, ""),
      titulo: tituloBonito(nombre),
      tipo: porArchivo ? extension(grupo[0].nombre) : "",
      ejecutable: ejecutable(grupo),
      carpeta,
      archivos: grupo.map(f => ({
        nombre: f.nombre, ruta: f.ruta, lenguaje: LENGUAJES[extension(f.nombre)],
        codigo: f.codigo, libreria: f.codigo.length > LIBRERIA_BYTES,
      })),
    });
  };
  for (const carpeta of carpetas) {
    const ficheros = porCarpeta.get(carpeta).sort((x, y) => natural(x.nombre, y.nombre));
    const paginas = ficheros.filter(f => esPagina(f.nombre));
    const otros = ficheros.filter(f => !esPagina(f.nombre));
    if (carpeta && paginas.length <= 1) {
      // Una sola página (o ninguna): la carpeta entera es un tema, con sus archivos en pestañas
      const partes = carpeta.split("/");
      crear(carpeta, partes[partes.length - 1], ficheros, false);
      continue;
    }
    // Varias páginas: cada una es un tema con los .js/.css que use; lo que no use ninguna va por separado
    const usados = new Set();
    for (const p of paginas) {
      const suyos = otros.filter(o => p.codigo.includes(o.nombre));
      suyos.forEach(o => usados.add(o));
      crear(carpeta, sinExtension(p.nombre), [p, ...suyos], true);
    }
    for (const o of otros) if (!usados.has(o)) crear(carpeta, sinExtension(o.nombre), [o], true);
  }
  return lecciones;
}

// ---------- Leer los archivos en directo desde GitHub ----------
// En GitHub Pages (https://usuario.github.io/repositorio/carpeta/pagina.html) usuario, repo y carpeta
// se deducen de la dirección; con doble clic se usa CONFIG. Con ?asignatura=X se baja a esa subcarpeta.
function repositorio() {
  let { usuario, repo, carpeta } = CONFIG;
  if (location.hostname.endsWith(".github.io")) {
    const segmentos = decodeURIComponent(location.pathname).split("/").filter(Boolean);
    if (segmentos.length && /\.html?$/i.test(segmentos[segmentos.length - 1])) segmentos.pop();
    usuario = location.hostname.split(".")[0];
    repo = segmentos[0];
    carpeta = segmentos.slice(1).join("/");
  }
  const asignatura = CONFIG.porParametro ? (new URLSearchParams(location.search).get("asignatura") || "").replace(/^\/+|\/+$/g, "") : "";
  return {
    usuario, repo, asignatura,
    carpeta: [carpeta, asignatura].filter(Boolean).join("/"),
    relativa: asignatura ? asignatura + "/" : "", // de esta página a los archivos (para "Abrir original")
  };
}
const ORIGEN = repositorio();
const codificar = ruta => ruta.split("/").map(encodeURIComponent).join("/");
const urlEnGitHub = ruta => `https://github.com/${ORIGEN.usuario}/${ORIGEN.repo}/blob/HEAD/${codificar([ORIGEN.carpeta, ruta].filter(Boolean).join("/"))}`;

// Los archivos de Windows a veces no están en UTF-8: si no lo son, se leen como Windows-1252 (tildes y eñes bien)
function decodificar(buffer) {
  try { return new TextDecoder("utf-8", { fatal: true }).decode(buffer); }
  catch (e) { return new TextDecoder("windows-1252").decode(buffer); }
}

async function cargarDesdeGitHub() {
  const { usuario, repo, carpeta } = ORIGEN;
  if (!usuario || !repo) return null;
  const prefijo = carpeta ? carpeta + "/" : "";

  // 1) La lista de archivos del repositorio (una sola petición a la API de GitHub)
  const r = await fetch(`https://api.github.com/repos/${usuario}/${repo}/git/trees/HEAD?recursive=1`);
  if (!r.ok) throw new Error(r.status === 403 ? "límite de consultas de GitHub alcanzado, prueba en un rato" : "GitHub respondió " + r.status);
  const arbol = await r.json();
  const rutas = arbol.tree
    .filter(n => n.type === "blob" && n.path.startsWith(prefijo) && LENGUAJES[extension(n.path)])
    .map(n => n.path.slice(prefijo.length))
    .filter(ruta => !["index.html", "explorador.html"].includes(ruta)); // el propio visor y la portada, no
  if (!rutas.length) throw new Error(`no hay archivos de código en «${carpeta || repo}»`);

  // 2) El contenido de cada archivo, desde raw.githubusercontent.com (GitHub lo permite desde cualquier página)
  return Promise.all(rutas.map(async ruta => {
    const resp = await fetch(`https://raw.githubusercontent.com/${usuario}/${repo}/HEAD/${codificar(prefijo + ruta)}`, { cache: "no-cache" });
    if (!resp.ok) throw new Error("no se pudo leer " + ruta);
    return { ruta, codigo: decodificar(await resp.arrayBuffer()) };
  }));
}

function coincidencias(l, q) {
  if (!q) return { visible: true, n: 0 };
  const enTitulo = (l.titulo + " " + l.numero + " " + l.carpeta).toLowerCase().includes(q);
  const n = l.archivos.reduce((s, f) => s + (f.libreria ? 0 : contar(f.codigo, q)), 0);
  return { visible: enTitulo || n > 0, n };
}

// ---------- Menú lateral ----------
function pintarMenu() {
  const q = estado.filtro;
  let html = "", bloqueActual = null, seccionActual = null, visibles = 0;
  LECCIONES.forEach(l => {
    const c = coincidencias(l, q);
    if (!c.visible) return;
    visibles++;
    if (l.bloque !== bloqueActual) {
      if (bloqueActual !== null) html += "</details>";
      const total = LECCIONES.filter(x => x.bloque === l.bloque).length;
      html += `<details open><summary>${escapar(l.bloque ? nombreBloque(l.bloque) : "Archivos sueltos")} <span>${total}</span></summary>`;
      bloqueActual = l.bloque; seccionActual = null;
    }
    if (l.seccion && l.seccion !== seccionActual) {
      html += `<div class="seccion">${escapar(nombreBloque(l.seccion.replace(/^[\d.]+\s*/, "")))}</div>`;
    }
    seccionActual = l.seccion;
    html += `<button class="leccion${l.id === estado.leccion ? " activa" : ""}" data-id="${l.id}">
      <span class="num">${escapar(l.numero)}</span><span>${escapar(l.titulo)}</span>
      ${l.tipo && l.tipo !== "html" ? `<span class="tipo">${escapar(l.tipo)}</span>` : ""}
      ${c.n ? `<span class="hits">${c.n}</span>` : ""}</button>`;
  });
  if (bloqueActual !== null) html += "</details>";
  $("menu").innerHTML = visibles ? html : `<div class="vacio">Sin resultados para «${escapar(q)}»</div>`;
}

$("menu").addEventListener("click", e => {
  const b = e.target.closest(".leccion");
  if (b) abrir(+b.dataset.id);
});

// ---------- Vista de código ----------
function abrir(id, archivo = 0) {
  estado.leccion = id; estado.archivo = archivo;
  const l = LECCIONES[id];
  guardar("visor-ultima:" + ORIGEN.carpeta, id);
  history.replaceState(null, "", "#" + id);
  $("migas").textContent = l.carpeta.split("/").join("  ›  ");
  $("titulo").textContent = (l.numero ? l.numero + "  " : "") + l.titulo;
  $("ejecutar").disabled = !l.ejecutable;
  $("ejecutar").textContent = l.ejecutable ? "▶ Ejecutar" : "🚫 No ejecutable";
  $("ejecutar").title = l.ejecutable ? "Ejecutar (R)"
    : l.archivos.some(f => f.lenguaje === "php") ? "El PHP necesita un servidor (como XAMPP): GitHub Pages no lo ejecuta"
    : "Este tipo de archivo no se puede ejecutar en el navegador";
  $("original").hidden = !l.ejecutable;
  $("anterior").disabled = id === 0;
  $("siguiente").disabled = id === LECCIONES.length - 1;
  $("pestanas").innerHTML = l.archivos.map((f, i) =>
    `<button class="pestana${i === archivo ? " activa" : ""}" data-i="${i}">${escapar(f.nombre)}</button>`).join("");
  pintarCodigo();
  $("resultado").hidden = true;
  $("marco").srcdoc = "";
  document.querySelectorAll(".leccion").forEach(b => b.classList.toggle("activa", +b.dataset.id === id));
  document.querySelector(".leccion.activa")?.scrollIntoView({ block: "nearest" });
}

function pintarCodigo() {
  if (!LECCIONES.length) return;
  const l = LECCIONES[estado.leccion], f = l.archivos[estado.archivo];
  const code = $("codigo");
  $("original").href = codificar(ORIGEN.relativa + f.ruta);
  $("github").href = urlEnGitHub(f.ruta);
  if (f.libreria) {
    code.innerHTML = `<div class="aviso">📦 <b>${escapar(f.nombre)}</b> es un archivo grande (${Math.round(f.codigo.length / 1024)} KB) y no se muestra aquí.<br>Puedes verlo con «Ver en GitHub»${LECCIONES[estado.leccion].ejecutable ? "; se carga igualmente al pulsar «Ejecutar»" : ""}.</div>`;
    return;
  }
  code.innerHTML = hljs.highlight(f.codigo, { language: f.lenguaje }).value;
  if (estado.filtro) marcar(code, estado.filtro);
}

// Resalta las coincidencias de la búsqueda dentro del código ya coloreado
function marcar(raiz, q) {
  const walker = document.createTreeWalker(raiz, NodeFilter.SHOW_TEXT);
  const nodos = [];
  while (walker.nextNode()) nodos.push(walker.currentNode);
  let primera = null;
  nodos.forEach(nodo => {
    const t = nodo.nodeValue, low = t.toLowerCase();
    if (!low.includes(q)) return;
    const frag = document.createDocumentFragment();
    let i = 0, j;
    while ((j = low.indexOf(q, i)) !== -1) {
      frag.append(t.slice(i, j));
      const m = document.createElement("mark");
      m.textContent = t.slice(j, j + q.length);
      frag.append(m);
      primera ??= m;
      i = j + q.length;
    }
    frag.append(t.slice(i));
    nodo.replaceWith(frag);
  });
  primera?.scrollIntoView({ block: "center" });
}

$("pestanas").addEventListener("click", e => {
  const b = e.target.closest(".pestana");
  if (!b) return;
  estado.archivo = +b.dataset.i;
  document.querySelectorAll(".pestana").forEach(p => p.classList.toggle("activa", p === b));
  pintarCodigo();
});

// ---------- Ejecutar en un iframe aislado ----------
// Se inyecta un "espía" que reenvía console.log y los errores a esta página.
const ESPIA = `<script>(function(){
  function fmt(v){ try{
    if (typeof v === "string") return v;
    if (typeof v === "function") return v.toString();
    if (v instanceof Error) return v.name + ": " + v.message;
    if (v instanceof Date) return v.toString();
    if (v === undefined) return "undefined";
    return JSON.stringify(v, null, 1);
  } catch(e){ return String(v); } }
  ["log","info","warn","error","table","debug"].forEach(function(t){
    var orig = console[t];
    console[t] = function(){
      parent.postMessage({ __apuntes: 1, tipo: t, texto: Array.prototype.map.call(arguments, fmt).join(" ") }, "*");
      if (orig) orig.apply(console, arguments);
    };
  });
  window.addEventListener("error", function(e){
    parent.postMessage({ __apuntes: 1, tipo: "error", texto: "❌ " + e.message + (e.lineno ? " (" + (e.filename && e.filename.indexOf("about:") !== 0 ? e.filename.split("/").pop() + ", " : "") + "línea " + e.lineno + ")" : "") }, "*");
  });
})();<\/script>`;

function construirPagina(l) {
  const principal = l.archivos.find(f => f.lenguaje === "html");
  const porNombre = Object.fromEntries(l.archivos.map(f => [f.nombre, f]));
  let html = principal ? principal.codigo
    : `<!DOCTYPE html><html><body><script>${l.archivos.map(f => f.codigo || "").join("\n")}<\/script></body></html>`;
  // Los .js/.css que tenemos incrustados se meten en línea; el resto (p. ej. moment.js) se carga desde el disco
  html = html.replace(/<script([^>]*?)src=["']([^"']+)["']([^>]*)><\/script>/gi, (m, a, src, b) => {
    const f = porNombre[src];
    return f ? `<script>${f.codigo.replace(/<\/script/gi, "<\\/script")}\n//# sourceURL=${f.nombre}<\/script>` : m;
  });
  html = html.replace(/<link[^>]*href=["']([^"']+\.css)["'][^>]*>/gi, (m, href) => {
    const f = porNombre[href];
    return f ? `<style>${f.codigo}</style>` : m;
  });
  const espia = ESPIA.replace(/\n\s*/g, " ");
  const base = `<base href="${(new URL(codificar(ORIGEN.relativa + l.carpeta) + "/", location.href).href)}">`;
  return /<head[^>]*>/i.test(html)
    ? html.replace(/<head[^>]*>/i, h => h + base + espia)
    : base + espia + html;
}

function ejecutar() {
  if (!LECCIONES.length || !LECCIONES[estado.leccion].ejecutable) return;
  const l = LECCIONES[estado.leccion];
  $("consola").innerHTML = "";
  $("resultado").hidden = false;
  $("marco").srcdoc = construirPagina(l);
  setTimeout(() => { if (!$("consola").children.length) $("consola").innerHTML = '<div class="nada">(Sin salida por consola)</div>'; }, 800);
  $("resultado").scrollIntoView({ behavior: "smooth", block: "start" });
}

window.addEventListener("message", e => {
  if (e.source !== $("marco").contentWindow || !e.data || !e.data.__apuntes) return;
  $("consola").querySelector(".nada")?.remove();
  const div = document.createElement("div");
  div.className = "linea " + e.data.tipo;
  div.textContent = e.data.texto === "" ? " " : e.data.texto;
  $("consola").append(div);
});

// ---------- Botones y atajos ----------
$("ejecutar").onclick = ejecutar;
$("limpiar").onclick = () => $("consola").innerHTML = "";
$("anterior").onclick = () => estado.leccion > 0 && abrir(estado.leccion - 1);
$("siguiente").onclick = () => estado.leccion < LECCIONES.length - 1 && abrir(estado.leccion + 1);
$("copiar").onclick = async () => {
  const f = LECCIONES[estado.leccion].archivos[estado.archivo];
  if (f.libreria) return;
  try { await navigator.clipboard.writeText(f.codigo); }
  catch (e) { // plan B para navegadores que bloquean el portapapeles en file://
    const t = document.createElement("textarea"); t.value = f.codigo; document.body.append(t); t.select(); document.execCommand("copy"); t.remove();
  }
  $("copiar").textContent = "✓ Copiado";
  setTimeout(() => $("copiar").textContent = "Copiar", 1200);
};
$("tema").onclick = () => guardar("apuntes-tema", document.body.classList.toggle("oscuro") ? "oscuro" : "claro");

let temporizador;
$("buscar").addEventListener("input", e => {
  clearTimeout(temporizador);
  temporizador = setTimeout(() => {
    estado.filtro = e.target.value.trim().toLowerCase();
    pintarMenu(); pintarCodigo();
  }, 120);
});
$("buscar").addEventListener("keydown", e => {
  if (e.key === "Enter") document.querySelector(".leccion")?.click();
  if (e.key === "Escape") { e.target.value = ""; e.target.dispatchEvent(new Event("input")); e.target.blur(); }
});

document.addEventListener("keydown", e => {
  if (e.target.matches("input, textarea") || e.ctrlKey || e.metaKey || e.altKey) return;
  if (e.key === "/") { e.preventDefault(); $("buscar").focus(); }
  else if (e.key === "ArrowLeft") $("anterior").click();
  else if (e.key === "ArrowRight") $("siguiente").click();
  else if (e.key.toLowerCase() === "r") ejecutar();
});

// ---------- Arranque ----------
if (leerGuardado("apuntes-tema") === "oscuro") document.body.classList.add("oscuro");
{
  const nombre = CONFIG.titulo || (ORIGEN.asignatura ? ORIGEN.asignatura.split("/").map(p => p.charAt(0).toUpperCase() + p.slice(1)).join(" › ") : ORIGEN.repo);
  $("nombre").textContent = nombre;
  $("logo").textContent = CONFIG.logo || "</>";
  document.title = nombre;
  $("volver").href = `https://${ORIGEN.usuario}.github.io/${ORIGEN.repo}/`;
}

function mostrar(archivos, origen, clase) {
  LECCIONES = agrupar(archivos);
  $("origen").textContent = origen;
  $("origen").className = "origen " + clase;
  pintarMenu();
  const inicial = parseInt(location.hash.slice(1) || leerGuardado("visor-ultima:" + ORIGEN.carpeta) || "0", 10);
  if (LECCIONES.length) abrir(LECCIONES[inicial] ? inicial : 0);
}

(async () => {
  try {
    const enDirecto = await cargarDesdeGitHub();
    if (enDirecto) return mostrar(enDirecto, "🟢 En directo desde GitHub", "directo");
    if (COPIA) mostrar(COPIA.archivos, `📦 Copia guardada del ${COPIA.fecha}`, "copia");
  } catch (e) {
    console.warn(e);
    const motivo = e instanceof TypeError ? "sin conexión con GitHub" : e.message; // fetch lanza TypeError si no hay red
    if (COPIA) return mostrar(COPIA.archivos, `⚠️ Copia del ${COPIA.fecha} (${motivo})`, "aviso");
    $("origen").textContent = `⚠️ No se pudo cargar (${motivo})`;
    $("origen").className = "origen aviso";
    $("menu").innerHTML = '<div class="vacio">Sin datos. Comprueba tu conexión y recarga la página.</div>';
  }
})();
</script>
