<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <h1>Comentarios en JS: con // o con /* ... */</h1>
    <script>
        //variables
        let b = 4;
        const c = 5;
        let d = 'DAW';
        alert(d);

        //operadores
        alert(b+c);
        alert(b-c);
        alert(b*c);
        alert(b/c);
        alert(b%c);
        alert(b**c);

        //and
        a && b;
        //or
        a || b;
        //not
        !a;

        //asignacion
        a = b;
        //comparacion
        a == b;
        //estrictamente igual (para validaciones, ej= tipo y numero)
        a === b;
        //distinto
        a != b;
        //desigualdad estricta
        a !== b;

        //mayor que
        a > b;
        //menor que
        a < b;
        //mayor o igual que
        a >= b;
        //menor o igual que
        a <= b;


        //palabras reservadas
        //if ... else
        //for
        //do ... while
        //switch ... case
        //break
        //continue
        //function
        //try ... catch
        //throw
        //var
        //let
        //const
        //return
        
        //funciones
        //function hola(){
        //
        //}

        //hola();

    </script>
</body>
</html>
