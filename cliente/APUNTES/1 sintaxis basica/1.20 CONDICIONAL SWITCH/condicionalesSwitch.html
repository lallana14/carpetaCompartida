    <script>
        /*

        switch(expresion){
            case valor1:
                instrucciones;

            case valor2:

            default:
                instrucciones;
        }
        */

        let nota = 8;
        switch(nota){
            case 5:
                alert("Aprobado");
                break;
            case 6:
                alert("Bien");
                break;
            case 7 && 8:
                alert("Notable");
                break;
            case 9 && 10:
                alert("Sobresaliente");
                break;
            default:
                alert("Suspenso");
        }
    </script>
