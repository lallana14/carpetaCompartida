<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <script>
        //puebas para operadores de comparacion
        let a = 5;
        let b = "5";
        let c = 5;

        console.log("a: " + a);
        console.log("b: '" + b + "'");
        console.log("c: " + c);

        //comparacion simple
        console.log("Comparacion simple");
        console.log("a == b: " + (a == b));
        console.log("a != b: " + (a != b));
        console.log(" ");
        console.log("a == c: " + (a == c));
        console.log("a != c: " + (a != c));
        console.log(" ");
        
        //comparacion estricta
        console.log("Comparacion estricta");
        console.log("a === b: " + (a === b));
        console.log("a !== b: " + (a !== b));
        console.log(" ");
        console.log("a === c: " + (a === c));
        console.log("a !== c: " + (a !== c));
        console.log(" ");

        let d = 10;
        let e = 2;

        console.log("d: " + d);
        console.log("e: " + e);

        //comparacion mayor y menor
        console.log("Comparacion mayor y menor");
        console.log("a > b: " + (a > b));
        console.log("a < b: " + (a < b));
        console.log(" ");
        console.log("a > c: " + (a > c));
        console.log("a < c: " + (a < c));
        console.log(" ");
        console.log("a > d: " + (a > d));
        console.log("a < d: " + (a < d));
        console.log(" ");
        console.log("a > e: " + (a > e));
        console.log("a < e: " + (a < e));
        console.log(" ");

        //comparacion mayor o igual y menor o igual
        console.log("Comparacion mayor o igual y menor o igual");
        console.log("a >= b: " + (a >= b));
        console.log("a <= b: " + (a <= b));
        console.log(" ");
        console.log("a >= c: " + (a >= c));
        console.log("a <= c: " + (a <= c));
        console.log(" ");
        console.log("a >= d: " + (a >= d));
        console.log("a <= d: " + (a <= d));
        console.log(" ");
        console.log("a >= e: " + (a >= e));
        console.log("a <= e: " + (a <= e));
        console.log(" ");

    </script>
</body>
</html>
