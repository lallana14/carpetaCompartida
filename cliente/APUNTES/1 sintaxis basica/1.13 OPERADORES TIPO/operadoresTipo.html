        //instanceof: devuelve true si un objeto es una instancia de otro objeto especificado
        let animales = ["perro", "gato", "conejo"];
        alert(animales instanceof Object);//true
        alert(animales instanceof Array);//true
        alert(animales instanceof Number);//false
        alert(animales instanceof String);//false

        //nulos vs no deifinidos
        alert(typeof null);//object
        alert(typeof undefined);//undefined
        alert(null == undefined);//true
        alert(null === undefined);//false
